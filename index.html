    <script>
      // Default to dark; the site is dark-first and matches the atlasz app.
      (function () {
        try {
          var t = localStorage.getItem('atlasz-theme') || 'dark';
          var isDark =
            t === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : t === 'dark';
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
